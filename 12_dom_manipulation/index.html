<html lang="en">
  <head>

    <title>DOM Manipulation</title>
  </head>

  <body>
    <h1 id="heading1">This is heading 1</h1>

    <h2 id="heading2">This is heading 2</h2>

    <h4 id="heading3">
      This is heading 3

    </h4>

    <h4 id="heading4">
      This is heading 4
      <span style="display: none">This is hidden text 2</span>

    <div class="className">this is class name</div>
    <br />

    <div class="query">this is query selector by class</div>

    <h5 id="selector">this is query selector by id</h5>

    <div class="para">this is para1</div>
    <br />
    <div class="para">this is para2</div>
    <br />

    <div class="para">this is para3</div>
    <h6>Hello</h6>
    <h6>Welcome</h6>
    <p>Paragraph 1</p>
    <p>Paragraph 2</p>

    <script src="script.js"></script>
