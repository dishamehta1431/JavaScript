<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>

    <!-- Click -->
    <button id="btn">Click</button>
    <br><br>

    <!-- Double Click -->
    <button id="dblClick">Double Click</button>
    <br><br>

    <!-- Submit -->
    <form id="myForm">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter Your Name">
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <br>

    <!-- Mouse Events -->

    <h1 id="mouseOver">Mouse Over</h1>

    <p id="mouseOut">Mouse Out</p>

    <h2 id="mouseEnter">Mouse Enter</h2>

    <h3 id="mouseLeave">Mouse Leave</h3>

    <button id="mouseDown">Mouse Down</button>

    <br><br>

    <button id="mouseUp">Mouse Up</button>

    <br><br>

    <p id="mouseMove">Mouse Move</p>

    <br>

    <!-- Keyboard Events -->

    <input type="text" id="keyDown" placeholder="Key Down">

    <br><br>

    <input type="text" id="keyUp" placeholder="Key Up">

    <br><br>

    <input type="text" id="keyPress" placeholder="Key Press">

    <script src="script.js"></script>

</body>
</html>
